site_name: YEO CFR SDK
site_description: Guides, how-tos and answers for adding on-device face recognition and liveness to your app.
site_url: https://yeo-messaging.github.io/YEOFRSDK-docs/guide/
copyright: >
  &copy; 2026 YEO Messaging Ltd, registered in England and Wales 10785061.
  <a href="https://yeo.tech/policies/terms-and-conditions">Terms and Conditions</a> |
  <a href="https://yeo.tech/policies/privacy-policy">Privacy Policy</a>

theme:
  name: material
  font: false
  logo: assets/yeo-logo.svg
  favicon: assets/yeo-favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy
    - toc.follow

plugins:
  - search
  - mike:
      alias_type: copy
      canonical_version: latest

extra:
  generator: false
  version:
    provider: mike
    default: latest
  social:
    - icon: material/web
      link: https://yeo.tech/
      name: yeo.tech
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/yeomessaging/
      name: YEO on LinkedIn
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/@yeo-messaging
      name: YEO on YouTube
    - icon: fontawesome/brands/instagram
      link: https://www.instagram.com/yeomessaging
      name: YEO on Instagram

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - assets/site.css

nav:
  - Home: index.md
  - Get started:
      - get-started/index.md
      - Before you start: get-started/before-you-start.md
      - Android: get-started/android.md
      - iOS: get-started/ios.md
      - React Native: get-started/react-native.md
      - Flutter: get-started/flutter.md
      - Capacitor: get-started/capacitor.md
      - Cordova: get-started/cordova.md
  - Guides:
      - guides/index.md
      - How it works: guides/how-it-works.md
      - Enrol a user: guides/enrol.md
      - Recognise a user: guides/recognise.md
      - Verify throughout a session: guides/continuous.md
      - Liveness: guides/liveness.md
      - Coach your users: guides/coach-users.md
      - Store the gallery: guides/store-the-gallery.md
      - Upgrade and re-enrol: guides/upgrade.md
      - Go-live checklist: guides/go-live.md
      - Troubleshooting: guides/troubleshooting.md
  - Data and privacy: data-and-privacy.md
  - FAQ: faq.md
  - Reference:
      - reference/index.md
      - Published versions: reference/versions.md
      - API references: reference/api.md
  - Support: support.md
  - yeo.tech: https://yeo.tech/
